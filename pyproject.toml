[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "simcoach"
version = "0.1.0"
requires-python = ">=3.11"
# fastapi>=0.132 is a SECURITY floor, not a feature floor: the CSRF guard on the
# mutating POSTs (Body(...) -> browser must preflight -> origin allowlist blocks it)
# relies on FastAPI's strict_content_type=True default, added in 0.132. On 0.115-0.131
# FastAPI parses a body as JSON when Content-Type is ABSENT -- and an absent
# Content-Type is a CORS-simple request, so no preflight fires and the guard is bypassed.
# Verified on the same Body(...) route: 0.130.0 and 0.131.0 -> handler ran (200);
# 0.132.0 and 0.141.1 -> 422. See tests/test_server_ingest.py.
dependencies = ["numpy>=1.26", "anthropic>=0.40", "keyring>=25", "fastapi>=0.132", "uvicorn>=0.30", "websockets>=13"]

# Explicit discovery: the repo is a flat layout with sibling non-package dirs
# (site/, brand/, frontend/, packaging/), so setuptools auto-discovery bails with
# "Multiple top-level packages discovered". Scope it to the one Python package so
# `pip install -e .` works in a fresh worktree venv (editable install then points at
# THAT worktree's source, not the main checkout).
[tool.setuptools.packages.find]
include = ["simcoach*"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff==0.16.8"]
voice = ["faster-whisper>=1.1", "kokoro-onnx==0.6.1", "misaki==0.7.4", "onnxruntime==1.30.0", "regex>=2024.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

# No explicit `select`: ruff's own default rule set is used, and the pinned
# `ruff==0.16.8` above (see [project.optional-dependencies] dev) freezes what
# that default resolves to, so a `pip install -e .[dev]` can't silently pick
# up a broader default rule set the way it did before (see #48). Only the
# repo's deliberate patterns are carved out below.
[tool.ruff.lint]
ignore = [
    "BLE001",  # except Exception is the sidecar/coach's designed silent-degrade path: it must never crash the capture thread
    "B008",    # FastAPI's own Body(...)/Depends(...) idiom in route signatures -- see the CSRF-guard note above
    "S110",    # try/except/pass is a deliberate silent-degrade pattern in capture/coach code
    "S112",    # try/except/continue -- same deliberate degrade pattern, loop form
]
