[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "simcoach"
version = "0.1.0"
requires-python = ">=3.11"
# fastapi>=0.131 is a SECURITY floor, not a feature floor: the CSRF guard on the
# mutating POSTs (Body(...) -> browser must preflight -> origin allowlist blocks it)
# relies on FastAPI's strict_content_type=True default, added in 0.131. On 0.115-0.130
# FastAPI parses a body as JSON when Content-Type is ABSENT -- and an absent
# Content-Type is a CORS-simple request, so no preflight fires and the guard is bypassed.
# Verified: 0.130.0 -> handler ran (200); 0.141.1 -> 422. See tests/test_server_ingest.py.
dependencies = ["numpy>=1.26", "anthropic>=0.40", "keyring>=25", "fastapi>=0.131", "uvicorn>=0.30", "websockets>=13"]

# Explicit discovery: the repo is a flat layout with sibling non-package dirs
# (site/, brand/, frontend/, packaging/), so setuptools auto-discovery bails with
# "Multiple top-level packages discovered". Scope it to the one Python package so
# `pip install -e .` works in a fresh worktree venv (editable install then points at
# THAT worktree's source, not the main checkout).
[tool.setuptools.packages.find]
include = ["simcoach*"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
