# Lint + test gate: ruff and pytest for the Python core, vitest + svelte-check
# for the frontend. Keeps both jobs cheap -- no voice extra (heavy ONNX/whisper
# deps), no LMU (tests/conftest.py stubs the live game).
name: Test

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install
        run: pip install -e ".[dev]"

      - name: ruff
        run: ruff check simcoach tests scripts

      - name: pytest
        run: pytest -q

  frontend:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: vitest
        run: npx vitest run

      - name: svelte-check
        run: npx svelte-check --threshold error
