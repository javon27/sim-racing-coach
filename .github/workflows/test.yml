# Lint + test gate: ruff and pytest for the Python core, vitest + svelte-check
# for the frontend. Keeps both jobs cheap -- no voice extra (heavy ONNX/whisper
# deps), no LMU (tests/conftest.py stubs the live game).
name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install
        run: pip install -e ".[dev]"

      - name: ruff
        run: ruff check simcoach tests scripts

      - name: pytest
        run: pytest -q

  frontend:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: vitest
        run: npx vitest run

      - name: svelte-check
        run: npx svelte-check --threshold error

  rust:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # src-tauri/build.rs (tauri_build::build()) only checks that the
      # externalBin and frontendDist paths named in tauri.conf.json exist on
      # disk -- it doesn't run the sidecar or bundle the frontend. Empty
      # placeholders satisfy that check so `cargo test` can compile here without
      # a full PyInstaller build or `npm run build` (both happen for real, with
      # real content, in build-installer.yml on a release tag).
      - name: Placeholder externalBin + frontendDist for the build script
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force src-tauri/binaries | Out-Null
          New-Item -ItemType File -Force src-tauri/binaries/simcoach-sidecar-x86_64-pc-windows-msvc.exe | Out-Null
          New-Item -ItemType Directory -Force frontend/dist | Out-Null
          Set-Content -Path frontend/dist/index.html -Value "<!doctype html>" -NoNewline

      - name: cargo test
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked
