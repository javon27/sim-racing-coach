# Build the Windows installer: freeze the Python sidecar (PyInstaller onefile),
# stage it as the Tauri externalBin, then bundle the Tauri app (MSI + NSIS).
# Runs on a version tag (v*) and on demand. A tagged run also drafts a GitHub
# release with the installers attached.
name: Build installer

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # draft a release + upload assets on a tag

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo + tauri-cli
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Python deps (voice extra, no-deps so the GPL transitives never land)
        run: |
          python -m pip install --upgrade pip
          pip install --only-binary=:all: onnxruntime==1.30.0 regex faster-whisper pyinstaller
          pip install --no-deps kokoro-onnx==0.6.1 misaki==0.7.4
          pip install .

      - name: Verify no GPL/LGPL TTS backend is importable
        run: |
          python -c "import importlib.util as u, sys; sys.exit(any(u.find_spec(m) for m in ('phonemizer','espeakng_loader','spacy','num2words')))"

      - name: Cache Kokoro model files
        id: kokoro-cache
        uses: actions/cache@v4
        with:
          path: kokoro-models
          # cache key is the two pinned SHA-256s (simcoach/voice.py KOKORO_FILES) so a
          # version bump there busts the cache instead of silently reusing stale models.
          key: kokoro-models-7d5df8ecf7d4b1878015a32686053fd0eebe2bc377234608764cc0ef3636a6c5-bca610b8308e8d99f32e6fe4197e7ec01679264efed0cac9140fe9c29f1fbf7d

      - name: Download Kokoro model files (cache miss)
        if: steps.kokoro-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force kokoro-models | Out-Null
          $base = "https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/"
          curl -L -o kokoro-models/kokoro-v1.0.onnx "${base}kokoro-v1.0.onnx"
          curl -L -o kokoro-models/voices-v1.0.bin "${base}voices-v1.0.bin"

      - name: Build sidecar (PyInstaller onefile)
        run: pyinstaller packaging/simcoach-sidecar.spec --distpath dist-sidecar --workpath build-sidecar

      - name: Prove /voice/speak works in the frozen exe
        shell: pwsh
        run: |
          $env:SIMCOACH_DATA_DIR = "$PWD\kokoro-data"
          New-Item -ItemType Directory -Force "$env:SIMCOACH_DATA_DIR\kokoro" | Out-Null
          Copy-Item kokoro-models\kokoro-v1.0.onnx "$env:SIMCOACH_DATA_DIR\kokoro\kokoro-v1.0.onnx"
          Copy-Item kokoro-models\voices-v1.0.bin "$env:SIMCOACH_DATA_DIR\kokoro\voices-v1.0.bin"
          $proc = Start-Process dist-sidecar\simcoach-sidecar.exe -PassThru
          try {
            $ok = $false
            for ($i = 0; $i -lt 30; $i++) {
              Start-Sleep -Seconds 1
              try { Invoke-WebRequest -Uri http://127.0.0.1:8765/voice/kokoro/status -UseBasicParsing | Out-Null; $ok = $true; break } catch {}
            }
            if (-not $ok) { throw "sidecar never came up" }
            curl -f -X POST http://127.0.0.1:8765/voice/speak -H "content-type: application/json" -d '{\"text\":\"Turn ten.\"}' -o out.wav
            $bytes = [System.IO.File]::ReadAllBytes("out.wav")[0..3]
            if (-not ([System.Text.Encoding]::ASCII.GetString($bytes) -eq "RIFF")) { throw "out.wav does not start with RIFF" }
          } finally {
            Stop-Process -Id $proc.Id -Force
          }

      - name: Stage sidecar as the Tauri externalBin
        shell: pwsh
        run: |
          $triple = ((rustc -Vv) -match '^host:' -replace 'host:\s*','').Trim()
          New-Item -ItemType Directory -Force src-tauri/binaries | Out-Null
          Copy-Item dist-sidecar/simcoach-sidecar.exe "src-tauri/binaries/simcoach-sidecar-$triple.exe"

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Build app + installer
        run: cargo tauri build

      - name: Upload installers (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: nestor-windows-installers
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe

      - name: Draft release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
