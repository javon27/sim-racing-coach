# Build the Windows installer: freeze the Python sidecar (PyInstaller onefile),
# stage it as the Tauri externalBin, then bundle the Tauri app (MSI + NSIS).
# Runs on a version tag (v*) and on demand. A tagged run also drafts a GitHub
# release with the installers attached.
name: Build installer

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # draft a release + upload assets on a tag

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo + tauri-cli
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install . pyinstaller

      - name: Build sidecar (PyInstaller onefile)
        run: pyinstaller packaging/simcoach-sidecar.spec --distpath dist-sidecar --workpath build-sidecar

      - name: Stage sidecar as the Tauri externalBin
        shell: pwsh
        run: |
          $triple = ((rustc -Vv) -match '^host:' -replace 'host:\s*','').Trim()
          New-Item -ItemType Directory -Force src-tauri/binaries | Out-Null
          Copy-Item dist-sidecar/simcoach-sidecar.exe "src-tauri/binaries/simcoach-sidecar-$triple.exe"

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Build app + installer
        run: cargo tauri build

      - name: Upload installers (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: nestor-windows-installers
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe

      - name: Draft release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
